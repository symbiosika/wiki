name: Release framework submodule

# Packages the symbiosika-framework submodule into framework.zip and publishes
# it as a GitHub Release on THIS repository, so environments that cannot check
# out the (separate) framework repo directly — notably Claude Code cloud
# sessions, whose git proxy only reaches this one repo — can still download it.
#
# The runner checks the submodule out normally (the framework repo is public),
# zips its contents, and publishes two releases:
#   * framework-<sha>  – immutable, reproducible per framework commit
#   * framework-latest – moving pointer to the most recent build
#
# Download + extract with .scripts/fetch-framework.sh.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Framework commit/branch/tag to package (default: the pinned submodule commit)'
        required: false
        default: ''
  push:
    branches:
      - main
      - develop
      - 'claude/**'
    # Re-package whenever the pinned framework commit (the gitlink) may have
    # moved, or when this workflow / its helper script changes.
    paths:
      - .gitmodules
      - backend/framework
      - .github/workflows/framework-release.yml
      - .scripts/fetch-framework.sh

# Releases and tags are created via the default token.
permissions:
  contents: write

# One build at a time; a newer push supersedes an in-flight one.
concurrency:
  group: framework-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-framework:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (with framework submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Move framework to requested ref (manual runs only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ref != '' }}
        working-directory: backend/framework
        run: |
          git fetch --depth 1 origin "${{ inputs.ref }}"
          git checkout --detach FETCH_HEAD

      - name: Determine framework commit
        id: fw
        run: |
          sha="$(git -C backend/framework rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "Framework commit: $sha"

      - name: Build framework.zip
        run: |
          set -euo pipefail
          # Archive the framework *contents* (no leading framework/ directory) so
          # the zip extracts cleanly into the submodule path. Skip VCS metadata.
          ( cd backend/framework && \
            zip -r -q "$GITHUB_WORKSPACE/framework.zip" . -x '.git/*' '.git' )
          printf '%s\n' "${{ steps.fw.outputs.sha }}" > framework.sha
          sha256sum framework.zip | awk '{print $1}' > framework.zip.sha256
          echo "Archive: $(du -h framework.zip | cut -f1)"
          echo "SHA256:  $(cat framework.zip.sha256)"

      - name: Publish per-commit release (framework-<sha>)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="framework-${{ steps.fw.outputs.sha }}"
          notes=$'Packaged `symbiosika-framework` submodule.\n\n'
          notes+=$'Commit: `${{ steps.fw.outputs.sha }}`\n\n'
          notes+=$'Extract into `backend/framework` '
          notes+=$'(see `.scripts/fetch-framework.sh`).'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" framework.zip framework.sha framework.zip.sha256 \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" framework.zip framework.sha framework.zip.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --title "Framework @ ${{ steps.fw.outputs.short }}" \
              --notes "$notes" \
              --prerelease
          fi

      - name: Update moving release (framework-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="framework-latest"
          notes=$'Most recent packaged `symbiosika-framework` submodule.\n\n'
          notes+=$'Commit: `${{ steps.fw.outputs.sha }}`\n\n'
          notes+=$'Download + extract with `.scripts/fetch-framework.sh`.'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --notes "$notes" --target "$GITHUB_SHA"
            gh release upload "$tag" framework.zip framework.sha framework.zip.sha256 \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" framework.zip framework.sha framework.zip.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --title "Framework (latest)" \
              --notes "$notes" \
              --prerelease
          fi

      - name: Summary
        run: |
          {
            echo "### Framework release published"
            echo ""
            echo "- Commit: \`${{ steps.fw.outputs.sha }}\`"
            echo "- Tags: \`framework-${{ steps.fw.outputs.sha }}\`, \`framework-latest\`"
            echo "- Asset: \`framework.zip\`"
            echo ""
            echo "Fetch with \`.scripts/fetch-framework.sh\`."
          } >> "$GITHUB_STEP_SUMMARY"
