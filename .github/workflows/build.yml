name: Build and push Docker images

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

# dorny/paths-filter reads the PR's changed files via the GitHub API on
# pull_request events, which requires pull-requests: read.
permissions:
  contents: read
  pull-requests: read

env:
  REGISTRY: symbiosika.azurecr.io

jobs:
  # ---------------------------------------------------------------------------
  # CHANGE DETECTION – only build the images that actually changed.
  #   app → main app image (backend + bundled frontend)
  #   mcp → standalone MCP server image
  # On a push to main or develop we force a full rebuild (a release/merge can
  # leave the paths-filter diff empty, and merging to these branches is a
  # deliberate release/staging deploy).
  # ---------------------------------------------------------------------------
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      mcp: ${{ steps.filter.outputs.mcp }}
      force: ${{ steps.meta.outputs.force }}
      # Image tag variant shared by every build job:
      #   pull_request → pr_<number>   (e.g. pr_12)
      #   push to main → latest
      #   any other ref → the branch name
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "image_tag=pr_${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            echo "image_tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

          if [ "${{ github.event_name }}" = "push" ] && { [ "${{ github.ref_name }}" = "main" ] || [ "${{ github.ref_name }}" = "develop" ]; }; then
            echo "force=true" >> "$GITHUB_OUTPUT"
          else
            echo "force=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'backend/**'
              - 'frontend/**'
              - 'Dockerfile'
              - '.github/workflows/build.yml'
            mcp:
              - 'mcp-server/**'
              - '.github/workflows/build.yml'

  # ---------------------------------------------------------------------------
  # FRONTEND – build the static SPA assets for the main app image.
  # ---------------------------------------------------------------------------
  build-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.app == 'true' || needs.detect-changes.outputs.force == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: frontend
        run: bun install

      - name: Build frontend
        working-directory: frontend
        run: bun run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-frontend
          path: frontend/dist
          retention-days: 1

  # ---------------------------------------------------------------------------
  # BACKEND – bundle the backend and gather migrations/config into an artifact
  # that matches what the root Dockerfile expects (see its release-ci stage).
  # ---------------------------------------------------------------------------
  build-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.app == 'true' || needs.detect-changes.outputs.force == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: backend
        run: bun install

      - name: Build backend
        working-directory: backend
        run: bun run build

      - name: Prepare artifact
        working-directory: backend
        run: |
          mkdir -p backend-artifact/dist
          mkdir -p backend-artifact/static
          mkdir -p backend-artifact/public
          mkdir -p backend-artifact/drizzle-sql
          mkdir -p backend-artifact/framework/drizzle-sql
          mkdir -p backend-artifact/src/db

          cp -r dist/* backend-artifact/dist/
          cp -r static/* backend-artifact/static/ 2>/dev/null || true
          cp -r public/* backend-artifact/public/ 2>/dev/null || true

          cp drizzle.config.ts backend-artifact/
          cp -r drizzle-sql/* backend-artifact/drizzle-sql/
          cp framework/drizzle.config.ts backend-artifact/framework/
          cp -r framework/drizzle-sql/* backend-artifact/framework/drizzle-sql/

          cp -r src/db/* backend-artifact/src/db/

          cp package.json backend-artifact/

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-backend
          path: backend/backend-artifact
          retention-days: 1

  # ---------------------------------------------------------------------------
  # MAIN APP IMAGE – backend bundle + bundled frontend, via the root Dockerfile.
  # ---------------------------------------------------------------------------
  build-docker-app:
    needs: [detect-changes, build-backend, build-frontend]
    if: needs.detect-changes.outputs.app == 'true' || needs.detect-changes.outputs.force == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-backend
          path: dist

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-frontend
          path: frontend_artifact

      - name: Merge frontend into dist
        run: |
          mkdir -p dist/static
          cp -r frontend_artifact/static/* dist/static/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.SYMBIOSIKA_AZURECR_IO_USER }}
          password: ${{ secrets.SYMBIOSIKA_AZURECR_IO_TOKEN }}

      - name: Build and push main app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.event.repository.name }}:${{ needs.detect-changes.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ github.event.repository.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ github.event.repository.name }}-app
          cache-to: type=gha,mode=max,scope=${{ github.event.repository.name }}-app

  # ---------------------------------------------------------------------------
  # MCP SERVER IMAGE – standalone OAuth2-protected MCP server (Bun).
  # ---------------------------------------------------------------------------
  build-docker-mcp:
    needs: detect-changes
    if: needs.detect-changes.outputs.mcp == 'true' || needs.detect-changes.outputs.force == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.SYMBIOSIKA_AZURECR_IO_USER }}
          password: ${{ secrets.SYMBIOSIKA_AZURECR_IO_TOKEN }}

      - name: Build and push MCP server image
        uses: docker/build-push-action@v6
        with:
          context: ./mcp-server
          file: ./mcp-server/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.event.repository.name }}-mcp:${{ needs.detect-changes.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ github.event.repository.name }}-mcp:${{ github.sha }}
          cache-from: type=gha,scope=${{ github.event.repository.name }}-mcp
          cache-to: type=gha,mode=max,scope=${{ github.event.repository.name }}-mcp

  # ---------------------------------------------------------------------------
  # COOLIFY DEPLOY TRIGGERS
  # After the images are pushed, ask Coolify to redeploy. Each job runs only
  # for its own branch (and never for pull_request builds, whose images are
  # tagged pr_<n> and not meant to be deployed).
  #
  # Config lives in repository settings, NOT in this file:
  #   Secrets (Settings → Secrets and variables → Actions → Secrets):
  #     COOLIFY_BASE_URL, COOLIFY_UUID_PROD, COOLIFY_UUID_STAGING,
  #     COOLIFY_DEPLOY_TOKEN
  # If they are not set, the job self-skips with a clear log line instead of
  # failing — so the build stays green until deploys are configured.
  # ---------------------------------------------------------------------------
  deploy-prod:
    needs: [build-docker-app, build-docker-mcp]
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deploy (production)
        continue-on-error: true
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_UUID: ${{ secrets.COOLIFY_UUID_PROD }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_BASE_URL" ] || [ -z "$COOLIFY_UUID" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "Coolify production deploy not configured (COOLIFY_BASE_URL / COOLIFY_UUID_PROD / COOLIFY_DEPLOY_TOKEN missing) — skipping."
            exit 0
          fi
          curl -sS -X GET \
            --max-time 2 --retry 2 --retry-all-errors \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_BASE_URL}/api/v1/deploy?uuid=${COOLIFY_UUID}&force=false" \
            || true

  deploy-staging:
    needs: [build-docker-app, build-docker-mcp]
    if: github.event_name != 'pull_request' && github.ref_name == 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deploy (staging)
        continue-on-error: true
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_UUID: ${{ secrets.COOLIFY_UUID_STAGING }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_BASE_URL" ] || [ -z "$COOLIFY_UUID" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "Coolify staging deploy not configured (COOLIFY_BASE_URL / COOLIFY_UUID_STAGING / COOLIFY_DEPLOY_TOKEN missing) — skipping."
            exit 0
          fi
          curl -sS -X GET \
            --max-time 2 --retry 2 --retry-all-errors \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_BASE_URL}/api/v1/deploy?uuid=${COOLIFY_UUID}&force=false" \
            || true
