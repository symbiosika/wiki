name: Build and push Docker images

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

# dorny/paths-filter reads the PR's changed files via the GitHub API on
# pull_request events, which requires pull-requests: read.
permissions:
  contents: read
  pull-requests: read

env:
  REGISTRY: symbiosika.azurecr.io

jobs:
  # ---------------------------------------------------------------------------
  # CHANGE DETECTION – only build the images that actually changed.
  #   app → main app image (backend + bundled frontend, incl. embedded MCP)
  # On a push to main or develop we force a full rebuild (a release/merge can
  # leave the paths-filter diff empty, and the images of these branches are
  # the ones that get deployed — outside this pipeline).
  # ---------------------------------------------------------------------------
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      force: ${{ steps.meta.outputs.force }}
      # Image tag variant shared by every build job:
      #   pull_request → pr_<number>   (e.g. pr_12)
      #   push to main → latest
      #   any other ref → the branch name
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "image_tag=pr_${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            echo "image_tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

          if [ "${{ github.event_name }}" = "push" ] && { [ "${{ github.ref_name }}" = "main" ] || [ "${{ github.ref_name }}" = "develop" ]; }; then
            echo "force=true" >> "$GITHUB_OUTPUT"
          else
            echo "force=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'backend/**'
              - 'frontend/**'
              - 'frontend-public/**'
              - 'Dockerfile'
              - '.github/workflows/build.yml'

  # ---------------------------------------------------------------------------
  # FRONTEND – build the static SPA assets for the main app image.
  # ---------------------------------------------------------------------------
  build-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.app == 'true' || needs.detect-changes.outputs.force == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: frontend
        run: bun install

      - name: Build frontend
        working-directory: frontend
        run: bun run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-frontend
          path: frontend/dist
          retention-days: 1

  # ---------------------------------------------------------------------------
  # PUBLIC FRONTEND – the read-only documentation site.
  #
  # Built separately from the authenticated SPA because it ships to a different
  # place: the backend serves ./static behind a login and ./public to everyone,
  # so this bundle goes into public/docs and the SPA into static/app.
  # ---------------------------------------------------------------------------
  build-frontend-public:
    needs: detect-changes
    if: needs.detect-changes.outputs.app == 'true' || needs.detect-changes.outputs.force == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: frontend-public
        run: bun install

      - name: Test
        working-directory: frontend-public
        run: bun run test

      - name: Build public frontend
        working-directory: frontend-public
        run: bun run build

      - name: Upload public frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-frontend-public
          path: frontend-public/dist
          retention-days: 1

  # ---------------------------------------------------------------------------
  # BACKEND – bundle the backend and gather migrations/config into an artifact
  # that matches what the root Dockerfile expects (see its release-ci stage).
  # ---------------------------------------------------------------------------
  build-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.app == 'true' || needs.detect-changes.outputs.force == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: backend
        run: bun install

      - name: Build backend
        working-directory: backend
        run: bun run build

      - name: Prepare artifact
        working-directory: backend
        run: |
          mkdir -p backend-artifact/dist
          mkdir -p backend-artifact/static
          mkdir -p backend-artifact/public
          mkdir -p backend-artifact/drizzle-sql
          mkdir -p backend-artifact/framework/drizzle-sql
          mkdir -p backend-artifact/src/db

          cp -r dist/* backend-artifact/dist/
          cp -r static/* backend-artifact/static/ 2>/dev/null || true
          cp -r public/* backend-artifact/public/ 2>/dev/null || true

          cp drizzle.config.ts backend-artifact/
          cp -r drizzle-sql/* backend-artifact/drizzle-sql/
          cp framework/drizzle.config.ts backend-artifact/framework/
          cp -r framework/drizzle-sql/* backend-artifact/framework/drizzle-sql/

          cp -r src/db/* backend-artifact/src/db/

          cp package.json backend-artifact/

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-backend
          path: backend/backend-artifact
          retention-days: 1

  # ---------------------------------------------------------------------------
  # MAIN APP IMAGE – backend bundle + bundled frontend, via the root Dockerfile.
  # ---------------------------------------------------------------------------
  build-docker-app:
    needs: [detect-changes, build-backend, build-frontend, build-frontend-public]
    if: needs.detect-changes.outputs.app == 'true' || needs.detect-changes.outputs.force == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-backend
          path: dist

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-frontend
          path: frontend_artifact

      - name: Download public frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-frontend-public
          path: frontend_public_artifact

      - name: Merge frontends into dist
        run: |
          # authenticated SPA -> static/ (served behind authOrRedirectToLogin)
          mkdir -p dist/static
          cp -r frontend_artifact/static/* dist/static/
          # documentation site -> public/ (served to everyone, no auth)
          mkdir -p dist/public
          cp -r frontend_public_artifact/public/* dist/public/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.SYMBIOSIKA_AZURECR_IO_USER }}
          password: ${{ secrets.SYMBIOSIKA_AZURECR_IO_TOKEN }}

      - name: Build and push main app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.event.repository.name }}:${{ needs.detect-changes.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ github.event.repository.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ github.event.repository.name }}-app
          cache-to: type=gha,mode=max,scope=${{ github.event.repository.name }}-app
