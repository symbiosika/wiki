<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wiki images</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1c1c1e;
        --fg-muted: #6e6e73;
        --accent: #7c6df2;
        --border: rgba(0, 0, 0, 0.12);
        --tile-bg: rgba(0, 0, 0, 0.05);
        --overlay-bg: rgba(0, 0, 0, 0.82);
      }
      :root[data-theme="dark"] {
        --fg: #ececf1;
        --fg-muted: #a1a1aa;
        --accent: #a396ff;
        --border: rgba(255, 255, 255, 0.16);
        --tile-bg: rgba(255, 255, 255, 0.08);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --fg: #ececf1;
          --fg-muted: #a1a1aa;
          --accent: #a396ff;
          --border: rgba(255, 255, 255, 0.16);
          --tile-bg: rgba(255, 255, 255, 0.08);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 16px;
        color: var(--fg);
        font:
          14px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      #status { color: var(--fg-muted); font-size: 13px; }
      header#head {
        margin-bottom: 10px;
        font-size: 13px;
        color: var(--fg-muted);
      }
      header#head strong { color: var(--fg); font-size: 15px; }

      /* single image */
      figure.single {
        margin: 0;
        text-align: center;
      }
      figure.single img {
        max-width: 100%;
        max-height: 70vh;
        border-radius: 10px;
        cursor: zoom-in;
      }
      figure.single figcaption {
        margin-top: 8px;
        font-size: 13px;
        color: var(--fg-muted);
      }

      /* gallery */
      #grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 10px;
      }
      #grid .tile {
        background: var(--tile-bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        aspect-ratio: 4 / 3;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: zoom-in;
      }
      #grid .tile img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      #grid .tile.broken {
        cursor: default;
        color: var(--fg-muted);
        font-size: 12px;
        padding: 8px;
        text-align: center;
      }

      /* lightbox overlay (also used in host fullscreen mode) */
      #lightbox {
        position: fixed;
        inset: 0;
        background: var(--overlay-bg);
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 10px;
        padding: 24px;
        z-index: 10;
      }
      #lightbox.open { display: flex; }
      #lightbox img {
        max-width: 100%;
        max-height: calc(100vh - 90px);
        border-radius: 8px;
      }
      #lightbox .caption { color: #f4f4f5; font-size: 13px; }
      #lightbox .close {
        position: absolute;
        top: 14px;
        right: 16px;
        border: none;
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        border-radius: 999px;
        width: 32px;
        height: 32px;
        font-size: 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header id="head" hidden></header>
    <div id="status">Loading image(s)…</div>
    <div id="content"></div>
    <div id="lightbox" role="dialog" aria-modal="true">
      <button class="close" aria-label="Close">✕</button>
      <img alt="" />
      <div class="caption"></div>
    </div>
    <script type="module">
      /*__APP_SCRIPT__*/
    </script>
  </body>
</html>
