<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wiki page</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1c1c1e;
        --fg-muted: #6e6e73;
        --bg: transparent;
        --accent: #7c6df2;
        --border: rgba(0, 0, 0, 0.12);
        --code-bg: rgba(0, 0, 0, 0.05);
      }
      :root[data-theme="dark"] {
        --fg: #ececf1;
        --fg-muted: #a1a1aa;
        --accent: #a396ff;
        --border: rgba(255, 255, 255, 0.16);
        --code-bg: rgba(255, 255, 255, 0.08);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --fg: #ececf1;
          --fg-muted: #a1a1aa;
          --accent: #a396ff;
          --border: rgba(255, 255, 255, 0.16);
          --code-bg: rgba(255, 255, 255, 0.08);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 16px 20px 20px;
        background: var(--bg);
        color: var(--fg);
        font:
          15px/1.6 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        overflow-x: hidden;
      }
      header#page-header {
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--border);
      }
      header#page-header h1 {
        margin: 0;
        font-size: 20px;
        line-height: 1.3;
      }
      header#page-header .crumbs {
        font-size: 12px;
        color: var(--fg-muted);
        margin-top: 2px;
      }
      article#page :is(h1, h2, h3, h4) {
        line-height: 1.3;
        margin: 1.2em 0 0.4em;
      }
      article#page h1 { font-size: 18px; }
      article#page h2 { font-size: 16px; }
      article#page h3 { font-size: 15px; }
      article#page p { margin: 0.5em 0; }
      article#page img {
        max-width: 100%;
        height: auto;
        border-radius: 8px;
        display: block;
        margin: 0.6em 0;
      }
      article#page img[data-align="center"] { margin-inline: auto; }
      article#page img[data-align="right"] { margin-left: auto; }
      article#page img[data-size="xs"] { max-width: 120px; }
      article#page img[data-size="sm"] { max-width: 240px; }
      article#page img[data-size="md"] { max-width: 420px; }
      article#page img[data-size="lg"] { max-width: 640px; }
      article#page img.loading {
        min-height: 60px;
        background: var(--code-bg);
      }
      article#page a { color: var(--accent); }
      article#page code {
        background: var(--code-bg);
        border-radius: 4px;
        padding: 0.1em 0.35em;
        font-size: 0.9em;
      }
      article#page pre {
        background: var(--code-bg);
        border-radius: 8px;
        padding: 10px 12px;
        overflow-x: auto;
      }
      article#page pre code { background: none; padding: 0; }
      article#page blockquote {
        margin: 0.6em 0;
        padding: 0.1em 1em;
        border-left: 3px solid var(--accent);
        color: var(--fg-muted);
      }
      article#page table {
        border-collapse: collapse;
        display: block;
        overflow-x: auto;
        max-width: 100%;
      }
      article#page :is(th, td) {
        border: 1px solid var(--border);
        padding: 4px 10px;
        text-align: left;
      }
      .wikilink {
        color: var(--accent);
        cursor: pointer;
        text-decoration: underline;
        text-decoration-style: dotted;
        text-underline-offset: 2px;
      }
      .wikilink.unresolvable {
        cursor: default;
        opacity: 0.7;
        text-decoration: none;
      }
      #status {
        color: var(--fg-muted);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <header id="page-header" hidden>
      <h1 id="page-title"></h1>
      <div class="crumbs" id="page-crumbs" hidden></div>
    </header>
    <div id="status">Loading page…</div>
    <article id="page"></article>
    <script type="module">
      /*__APP_SCRIPT__*/
    </script>
  </body>
</html>
